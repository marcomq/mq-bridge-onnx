[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mq-bridge-onnx"
version = "0.1.1"
description = "Local ONNX inference endpoints for mq-bridge: text embeddings and model scoring"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.8"
keywords = ["messaging", "onnx", "mq-bridge", "embeddings", "inference"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: System :: Networking",
]
# Deliberately no dependency on mq-bridge: the two are installed and upgraded
# independently, and `register()` reports a clear error if mq-bridge is absent.
dependencies = []

[project.urls]
Repository = "https://github.com/marcomq/mq-bridge-onnx"

[tool.setuptools]
# The wheel carries a prebuilt library, so it is platform-specific;
# mq_bridge.plugin_packaging stages the library and applies the platform tag.
packages = ["mq_bridge_onnx"]

[tool.setuptools.package-data]
mq_bridge_onnx = ["*.so", "*.dylib", "*.dll", "mq-bridge-plugin.json", "THIRD_PARTY_NOTICES", "LICENSE-*"]

schema_version: 1

context:
  version: ${{ env.get("MQ_BRIDGE_PLUGIN_VERSION") }}

package:
  name: mq-bridge-onnx
  version: ${{ version }}

# Nothing is compiled here. `stage/` holds the prebuilt archive the release
# publishes, so the conda package ships the same library as the wheel, the npm
# package and the Homebrew formula rather than a separately built copy.
source:
  path: stage
  # CI stages exactly what belongs in the package; gitignore rules must not
  # quietly drop a library on the way in.
  use_gitignore: false

build:
  number: 0
  # mq-bridge probes `<prefix>/lib/mq-bridge` on Unix and `Library\bin` on
  # Windows, where a conda environment keeps its DLLs. Installing there is the
  # whole installation: a route can name the `onnx` endpoint with no
  # config.
  script:
    content:
      - if: win
        then:
          - if not exist "%LIBRARY_BIN%" mkdir "%LIBRARY_BIN%"
          - copy /Y mq_bridge_onnx.dll "%LIBRARY_BIN%"
        else:
          - mkdir -p "${PREFIX}/lib/mq-bridge"
          - cp libmq_bridge_onnx.* "${PREFIX}/lib/mq-bridge/"

tests:
  - package_contents:
      files:
        - if: win
          then: Library/bin/mq_bridge_onnx.dll
          else: lib/mq-bridge/libmq_bridge_onnx.*

about:
  homepage: https://github.com/marcomq/mq-bridge-onnx
  repository: https://github.com/marcomq/mq-bridge-onnx
  documentation: https://marcomq.github.io/mq-bridge/
  summary: Local ONNX inference endpoint plugin for mq-bridge
  description: |
    A loadable endpoint plugin that runs ONNX models inside mq-bridge. It is
    a shared library, not a program: install it into the same environment as
    mq-bridge-app, or any environment whose mq-bridge host searches this
    prefix, and routes can then use the `onnx` endpoint.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE

extra:
  recipe-maintainers:
    - marcomq
